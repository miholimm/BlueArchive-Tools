services:
  app:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bluearchive}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bluearchive}
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
  init-db:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/postgresql/data && chown -R 999:999 /var/lib/postgresql/data"]
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluearchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bluearchive}
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
