location = /resource-console {
    return 301 /resource-console/;
}

location ^~ /resource-console/resource-api/ {
    proxy_pass https://api.bluearchive.help/;
    proxy_http_version 1.1;
    proxy_set_header Host api.bluearchive.help;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_read_timeout 20s;
}

location ^~ /resource-console/ {
    root /opt/blue-archive;
    index index.html;
    try_files $uri $uri/ /resource-console/index.html;
}
