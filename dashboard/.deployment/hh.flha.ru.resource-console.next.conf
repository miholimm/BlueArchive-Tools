server {
    server_name hh.flha.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /resource-console {
        return 301 /resource-console/;
    }

    location ^~ /resource-console/resource-api/ {
        proxy_pass https://api.bluearchive.help/;
        proxy_http_version 1.1;
        proxy_set_header Host api.bluearchive.help;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 20s;
    }

    location ^~ /resource-console/ {
        root /opt/blue-archive;
        index index.html;
        try_files $uri $uri/ /resource-console/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hh.flha.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hh.flha.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = hh.flha.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name hh.flha.ru;
    return 404; # managed by Certbot
}
