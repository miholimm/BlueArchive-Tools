name: Repack

on:
  # 手动触发：可在 input 中自由选择服务器 / 资源类型 / 平台 / 处理选项
  workflow_dispatch:
    inputs:
      server:
        description: '选择服务器'
        required: true
        default: 'CN'
        type: choice
        options:
          - CN
          - GL
          - JP
      action:
        description: '选择资源类型'
        required: true
        default: 'Table'
        type: choice
        options:
          - Table
          - Media
          - Bundle
          - Windows
      platform:
        description: '选择客户端平台（auto 表示按服务器/类型自动推断）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - Android
          - iOS
          - Windows
      modify_name:
        description: '是否修改文件名（启用 --name）'
        required: false
        default: 'false'
        type: boolean
      debug:
        description: '是否开启调试（启用 --debug）'
        required: false
        default: 'false'
        type: boolean
      voice_lang:
        description: '语音语言（启用 --voice_lang，例如 CN/KR/Default）'
        required: false
        type: string
  # 自动触发：由上游 Update 流程通过 repository_dispatch 调用
  repository_dispatch:
    types: [RepackTable, RepackMedia, RepackBundle, RepackWindows]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      server: ${{ steps.resolve.outputs.server }}
      action: ${{ steps.resolve.outputs.action }}
      dispatch_action: ${{ steps.resolve.outputs.dispatch_action }}
    steps:
      - name: Resolve Inputs
        id: resolve
        shell: bash
        run: |
          SERVER="${{ github.event.inputs.server || github.event.client_payload.server }}"
          PLATFORM="${{ github.event.inputs.platform }}"
          MANUAL_ACTION="${{ github.event.inputs.action }}"

          if [ -z "$SERVER" ]; then SERVER="CN"; fi
          if [ -z "$PLATFORM" ]; then PLATFORM="auto"; fi

          if [ -n "$MANUAL_ACTION" ]; then
            # workflow_dispatch：action 为干净类型，构造带前缀的 dispatch 事件名
            ACTION="$MANUAL_ACTION"
            DISPATCH_ACTION="Repack${MANUAL_ACTION}"
          else
            # repository_dispatch：event.action 形如 RepackTable，需去掉前缀得到干净类型
            RAW_ACTION="${{ github.event.action }}"
            ACTION=$(echo "$RAW_ACTION" | sed 's/^Repack//')
            DISPATCH_ACTION="$RAW_ACTION"
          fi

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "dispatch_action=$DISPATCH_ACTION" >> "$GITHUB_OUTPUT"

      - name: Set Matrix
        id: set-matrix
        shell: bash
        env:
          SERVER: ${{ steps.resolve.outputs.server }}
          ACTION: ${{ steps.resolve.outputs.action }}
          PLATFORM: ${{ steps.resolve.outputs.platform }}
        run: |
          # 手动选择了具体平台时，直接使用该平台
          if [ "$PLATFORM" != "auto" ]; then
            matrix="[\"$PLATFORM\"]"
          else
            case "$SERVER:$ACTION" in
              JP:Media)
                JSON="['Android', 'Windows']"
                ;;
              JP:Bundle)
                JSON="['Android', 'iOS', 'Windows']"
                ;;
              *)
                JSON="['Android']"
                ;;
            esac
            matrix="$JSON"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  process:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      should_restart: ${{ steps.check_reason.outputs.should_restart }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    env:
      PYTHONUTF8: 1
      PYTHONUNBUFFERED: "1"
      SERVER: ${{ needs.prepare.outputs.server }}
      ACTION: ${{ needs.prepare.outputs.action }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Login
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install requirements
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y sqlcipher libsqlcipher-dev
          pip install pysqlcipher3

      - name: Get Catalog
        id: update
        run: |
          start_time=$(date +%s)
          timeout_limit=$((5 * 60 * 60))

          while true; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))
            if [ $elapsed -ge $timeout_limit ]; then
              echo "timeout=true" >> $GITHUB_OUTPUT
              break
            fi

            python -m get.get_catalog "$SERVER" "$ACTION" "$PLATFORM"

            if [ -f "CATALOG_FOUND" ]; then
              echo "detected=true" >> $GITHUB_OUTPUT
              break
            fi
            sleep 60
          done

      - name: Execute Table Logic
        if: needs.prepare.outputs.action == 'Table' && steps.update.outputs.detected == 'true'
        run: |
          git clone --depth 1 git@github.com:beichen23333/BA-Text.git BA-Text
          git clone --depth 1 -b GL git@github.com:beichen23333/BA-TableBundles.git BA-TableBundles

          python -m get.get_files "$SERVER" Table "$PLATFORM" -f ExcelDB.db Excel.zip
          python -m get.get_catalog JP Media "$PLATFORM"

          if [ "$SERVER" = "CN" ]; then
            DB_KEY=""
          elif [ "$SERVER" = "JP" ]; then
            DB_KEY=$(sed -n '1p' BA-Text/key.txt)
          elif [ "$SERVER" = "GL" ]; then
            DB_KEY=$(sed -n '2p' BA-Text/key.txt)
          fi

          git clone --depth 1 -b "$SERVER" git@github.com:beichen23333/BA-FlatData.git FlatData

          EXTRA_ARGS="--catalog --replace --repack_dir BA-Text --debug_json BA-Text/debug.json"

          if [ "${{ github.event.inputs.modify_name || github.event.client_payload.modify_name }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --name"
          fi

          if [ "${{ github.event.inputs.debug || github.event.client_payload.debug }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --debug"
          fi

          VOICE_LANG="${{ github.event.inputs.voice_lang || github.event.client_payload.voice_lang }}"
          if [ -n "$VOICE_LANG" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --voice_lang $VOICE_LANG"
          fi

          python process_excel.py Download_Temp output "$SERVER" Repack $EXTRA_ARGS --db_key "$DB_KEY"

      - name: Prepare Artifacts
        run: |
          mkdir -p upload
          mkdir -p Catalog

          mv Catalog/ upload/
          mv Download_Temp/* upload/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Repack-TableBundles
          path: upload/
          if-no-files-found: warn

      - name: Terminate and Trigger Restart
        id: check_reason
        if: steps.update.outputs.timeout == 'true'
        run: |
          echo "should_restart=true" >> "$GITHUB_OUTPUT"
          gh run cancel ${{ github.run_id }}

  restart:
    needs: [prepare, process]
    if: always()
    runs-on: ubuntu-latest
    env:
      SERVER: ${{ needs.prepare.outputs.server }}
      DISPATCH_ACTION: ${{ needs.prepare.outputs.dispatch_action }}
    steps:
      - name: Restart Workflow
        if: needs.process.outputs.should_restart == 'true'
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.UPDATE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d "{\"event_type\": \"$DISPATCH_ACTION\", \"client_payload\": {\"server\": \"$SERVER\"}}"

      - name: Send email on Restart
        if: needs.process.outputs.should_restart == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ⚠️ 警告 - Repack流程终止
          body: |
            检测到Repack流程因服务器维护被终止，您可以点击下方链接查看详情。
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.TARGET_EMAIL }}
          from: 北辰汉化组 <${{ secrets.EMAIL_USERNAME }}>