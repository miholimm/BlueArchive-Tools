name: Extractor

on:
  # 手动触发：可在 input 中自由选择服务器 / 资源类型 / 平台
  workflow_dispatch:
    inputs:
      server:
        description: '选择服务器'
        required: true
        default: 'CN'
        type: choice
        options:
          - CN
          - GL
          - JP
      action:
        description: '选择资源类型'
        required: true
        default: 'Table'
        type: choice
        options:
          - Table
          - Media
          - Bundle
      platform:
        description: '选择客户端平台（auto 表示按服务器/类型自动推断多平台）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - Android
          - iOS
          - Windows
  # 自动触发：由上游 Update 流程通过 repository_dispatch 调用
  repository_dispatch:
    types:
      - Table
      - Media
      - Bundle

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  CATALOG_TIMEOUT: "18000"
  CATALOG_RETRY_INTERVAL: "60"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      server: ${{ steps.resolve.outputs.server }}
      action: ${{ steps.resolve.outputs.action }}
    steps:
      # 统一解析参数：workflow_dispatch 用 inputs，repository_dispatch 用 client_payload / event
      - name: Resolve Inputs
        id: resolve
        shell: bash
        run: |
          SERVER="${{ github.event.inputs.server || github.event.client_payload.server }}"
          ACTION="${{ github.event.inputs.action || github.event.action }}"
          PLATFORM="${{ github.event.inputs.platform }}"

          if [ -z "$SERVER" ]; then SERVER="CN"; fi
          if [ -z "$ACTION" ]; then ACTION="Table"; fi
          if [ -z "$PLATFORM" ]; then PLATFORM="auto"; fi

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Set Matrix
        id: set-matrix
        shell: bash
        env:
          SERVER: ${{ steps.resolve.outputs.server }}
          ACTION: ${{ steps.resolve.outputs.action }}
          PLATFORM: ${{ steps.resolve.outputs.platform }}
        run: |
          # 手动选择了具体平台时，直接使用该平台
          if [ "$PLATFORM" != "auto" ]; then
            matrix="[\"$PLATFORM\"]"
          else
            case "$SERVER:$ACTION" in
              JP:Media)
                matrix='["Android","Windows"]'
                ;;
              JP:Bundle)
                matrix='["Android","iOS","Windows"]'
                ;;
              *)
                matrix='["Android"]'
                ;;
            esac
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  process:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    outputs:
      should_restart: ${{ steps.check_reason.outputs.should_restart }}

    env:
      SERVER: ${{ needs.prepare.outputs.server }}
      ACTION: ${{ needs.prepare.outputs.action }}
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install Dependencies
        shell: bash
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y sqlcipher libsqlcipher-dev
          pip install pysqlcipher3

      - name: Get Catalog
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start_time=$(date +%s)

          while true; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))

            if (( elapsed >= CATALOG_TIMEOUT )); then
              echo "timeout=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            rm -f CATALOG_FOUND

            if python -m get.get_catalog "$SERVER" "$ACTION" "$PLATFORM"; then
              if [[ -f CATALOG_FOUND ]]; then
                echo "detected=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            sleep "$CATALOG_RETRY_INTERVAL"
          done

      - name: Get Version
        id: version
        if: steps.update.outputs.detected == 'true'
        shell: bash
        run: |
          chmod +x get/get_version.sh

          version=$(./get/get_version.sh "$SERVER" true TableVersion)

          if [[ -z "$version" ]]; then
            echo "Failed to get version."
            exit 1
          fi

          echo "full_version=$version" >> "$GITHUB_OUTPUT"

      - name: Execute Table Logic
        if: needs.prepare.outputs.action == 'Table' && steps.update.outputs.detected == 'true'
        shell: bash
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          git clone --depth 1 git@github.com:BlueArchive-Translation/BA-Text.git BA-Text

          python -m get.get_files "$SERVER" Table "$PLATFORM" -f ExcelDB.db Excel.zip

          TEMP_DIR=$(mktemp -d)
          git clone git@github.com:BlueArchive-Translation/BlueArchive-API.git "$TEMP_DIR/BlueArchive-API"
          cp -a "$TEMP_DIR/BlueArchive-API/." .
          rm -rf "$TEMP_DIR"

          python -m get.get_keys "$SERVER"

          git clone --depth 1 -b "$SERVER" git@github.com:beichen23333/BA-FlatData.git FlatData

          python process_excel.py Download_Temp output "$SERVER" Extract --db_key "$DB_KEY"

          filename="${{ steps.version.outputs.full_version }}.zip"

          7z a "$filename" ./output/*

          git clone git@github.com:beichen23333/BA-TableBundles.git BA-TableBundles

          cd BA-TableBundles

          git lfs install
          git checkout main

          cp "../$filename" .

          git add "$filename"

          if ! git diff-index --quiet HEAD --; then
            git commit -m "Update Table: ${{ steps.version.outputs.full_version }}"
            git push origin main
          else
            echo "没有检测到变动，跳过提交。"
          fi

          git checkout "$SERVER"

          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cp -rv ../output/. .

          find . -type f -size +100M -exec git lfs track "{}" \;

          git add .

          if ! git diff-index --quiet HEAD --; then
            git commit -m "Update Table Data: ${{ steps.version.outputs.full_version }}"
            git push origin "$SERVER"
          else
            echo "没有检测到变动，跳过提交。"
          fi

      - name: Check Restart Reason
        id: check_reason
        if: steps.update.outputs.timeout == 'true'
        shell: bash
        run: |
          echo "should_restart=true" >> "$GITHUB_OUTPUT"

  restart:
    needs: [prepare, process]
    if: always() && needs.process.outputs.should_restart == 'true'
    runs-on: ubuntu-latest

    env:
      SERVER: ${{ needs.prepare.outputs.server }}
      ACTION: ${{ needs.prepare.outputs.action }}

    steps:
      - name: Restart Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --input - <<EOF
          {
            "event_type": "$ACTION",
            "client_payload": {
              "server": "$SERVER"
            }
          }
          EOF

      - name: Send Email on Restart
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ 警告 - Extract流程终止"
          body: |
            检测到Extract流程因服务器维护被终止，您可以点击下方链接查看详情。

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.TARGET_EMAIL }}
          from: "北辰汉化组 <${{ secrets.EMAIL_USERNAME }}>"
